security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_back_user_provider:
            entity:
                class: App\BackUsers\Domain\Entity\BackUser
                property: email

        app_user_provider:
            entity:
                class: App\Users\Domain\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Frontend / API
        login:
            pattern: ^/api/user_login
            stateless: true
           

        register:
            pattern: ^/api/register
            stateless: true

        api:
            pattern: ^/api(?!/user_login)
            stateless: true
            provider: app_user_provider
            jwt: ~

        # Backoffice / pages classiques
        main:
            lazy: true
            provider: app_back_user_provider
            pattern: ^/            
            custom_authenticator: App\BackUsers\Infrastructure\Security\LoginAuthenticator
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
            

    access_control:
        # Accès public (frontend)
        - { path: ^/api/user_login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/allBooks, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/allBooks/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/all_books/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/categories, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/verify/email, roles: PUBLIC_ACCESS }
        - { path: ^/api/stripe/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/payment/success, roles: PUBLIC_ACCESS }
        - { path: ^/api/seller/sellerPayment/\d+/accept, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/seller/sellerPayment/\d+/refuse, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/seller/sellerPayment/\d+/checkConfirmationToken, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/authors, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/stripe/connect/return, roles: PUBLIC_ACCESS, methods: [GET] }


        # Accès restreint (frontend)
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/orders, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/books, roles: IS_AUTHENTICATED_FULLY, methods: [POST, PUT] }
       
        - { path: ^/api/userBooks, roles: IS_AUTHENTICATED_FULLY, methods: [GET]}
        - { path: ^/api/seller/findSellerPaymentPendingConfirmation, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }
        - { path: ^/api/seller/findSellerPaymentConfirmed, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }
        - { path: ^/api/seller/findSellerPaymentShipped, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }
        - { path: ^/api/authorNamesByUser, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }

        - { path: ^/api/deleteBook/\d+$, roles: IS_AUTHENTICATED_FULLY, methods: [DELETE]}

        - { path: ^/api/unavailableBook/\d+$, roles: IS_AUTHENTICATED_FULLY, methods: [PATCH]}
        - { path: ^/api/updateStock/\d+/\d+$, roles: IS_AUTHENTICATED_FULLY, methods: [PATCH]}
        - { path: ^/api/seller/sellerPayment/\d+/toBeShipped, roles: IS_AUTHENTICATED_FULLY, methods: [PATCH] }

        - { path: ^/api/stripe/connect/onboarding, roles: IS_AUTHENTICATED_FULLY, methods: [POST]}

        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

        # Accès public (backend)
        - { path: ^/ , roles: PUBLIC_ACCESS }
        - { path: ^/test , roles: PUBLIC_ACCESS }