security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Users\Domain\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/user_login
            stateless: true
           

        register:
            pattern: ^/api/register
            stateless: true

        api:
            pattern: ^/api(?!/user_login)
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/user_login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/books, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/categories, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/verify/email, roles: PUBLIC_ACCESS }

        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/orders, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/books, roles: IS_AUTHENTICATED_FULLY, methods: [POST, PUT] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
