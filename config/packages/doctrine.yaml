doctrine:
    dbal:
       
        user:     '%env(DATABASE_USER)%'
        password: '%env(DATABASE_PASSWORD)%'
        host:     '%env(DATABASE_HOST)%'
        port:     '%env(DATABASE_PORT)%'
        dbname:   '%env(DATABASE_NAME)%'
        driver:   pdo_mysql
        # OR url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:            
            Categories:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Categories/Domain/Entity'
                prefix: 'App\Categories\Domain\Entity'
                alias: Categories
            Books:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Books/Domain/Entity'
                prefix: 'App\Books\Domain\Entity'
                alias: Books
            Users:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Users/Domain/Entity'
                prefix: 'App\Users\Domain\Entity'
                alias: Users
            AuthorProfiles:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/AuthorProfiles/Domain/Entity'
                prefix: 'App\AuthorProfiles\Domain\Entity'
                alias: AuthorProfiles
            #App:
                #type: attribute
                #is_bundle: false
                #dir: '%kernel.project_dir%/src/Entity'
                #prefix: 'App\Entity'
                #alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
