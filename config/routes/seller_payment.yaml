  controller: App\SellerPayments\UI\Controller\SellerActionSellerPaymentController::itemShipped
  methods: [PATCH]

api.seller.accept.sellerPayment:
  path: /api/seller/sellerPayment/{id}/accept
  controller: App\SellerPayments\UI\Controller\SellerActionSellerPaymentController::accept
  methods: [POST]

api.seller.refuse.sellerPayment:
  path: /api/seller/sellerPayment/{id}/refuse
  controller: App\SellerPayments\UI\Controller\SellerActionSellerPaymentController::refuse
  methods: [POST]





api.seller.find.sellerPayment.checkToken:
