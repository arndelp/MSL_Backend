api.books.post:
  path: /api/books
  controller: App\Books\UI\Controller\BookController::record
  methods: [POST]

api.books.alls:
  path: /api/allBooks
  controller: App\Books\UI\Controller\BookController::Alls
  methods: [GET]

api.books.detail:
  path: /api/allBooks/{id}
  controller: App\Books\UI\Controller\BookController::detail
  methods: [GET]



api.books.user:
  path: /api/userBooks
  controller: App\Books\UI\Controller\BookController::getPersonnalBooks
  methods: [GET]

api.books.delete:
  path: /api/deleteBook/{id}
  controller: App\Books\UI\Controller\BookController::delete
  methods: [DELETE]

api.books.unavailable:
  path: /api/unavailableBook/{id}
  controller: App\Books\UI\Controller\BookController::toBeUnavailable
  methods: [PATCH]

api.books.changeStock:
  path: /api/updateStock/{id}/{quantity}
  controller: App\Books\UI\Controller\BookController::toUpdateStock
  methods: [PATCH]

api.books.authors:
  path: /api/authors
  controller: App\Books\UI\Controller\BookController::getAllAuthorNames
  methods: [GET]

api.books.author:
  path: /api/authorNamesByUser
  controller: App\Books\UI\Controller\BookController::getAuthorNamesByUser
  methods: [GET]




books.not.verified:
  path: /admin/notVerifiedBooks
  controller: App\Books\UI\Controller\BookController::getNotVerifiedBooks
  methods: [GET]
  defaults:
        _format: html
  requirements:
        _format: html|json

book.detail:
    path: /admin/notVerifiedBooks/{id}
    controller: App\Books\UI\Controller\BookController::detailBookToBeVerified
    methods: [GET]
    defaults:
        _format: html
    requirements:
        _format: html|json
 
book.verify:
    path: /admin/notVerifiedBooks/{id}/verify
    controller: App\Books\UI\Controller\BookController::toBeVerified
    methods: [POST, PATCH]

book.reject:
    path: /admin/notVerifiedBooks/{id}/reject
    controller: App\Books\UI\Controller\BookController::toBeRejected
    methods: [POST, PATCH]

books.deleted:
    path: /admin/deletedBooks
    controller: App\Books\UI\Controller\BookController::getDeletedBooks
    methods: [GET]
    defaults:
        _format: html
    requirements:
        _format: html|json

book.remove:
    path: /admin/deletedBooks/{id}/remove
    controller: App\Books\UI\Controller\BookController::removeBook
    methods: [POST]

books.filtered:
    path: /admin/booksFiltered
    controller: App\Books\UI\Controller\BookController::indexFiltered
    methods: [GET]

books.list.details:
    path: /admin/books/{id}
    controller: App\Books\UI\Controller\BookController::booksDetails
    methods: [GET]
