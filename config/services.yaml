# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    contact_receiver_email: '%env(CONTACT_RECEIVER_EMAIL)%'
    
    stripe_webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'

services:

    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

      

    App\:
        resource: '../src/'

    App\Users\UI\Controller\LoginController:
        tags: ['controller.service_arguments']

    App\Payments\UI\Controller\:
        resource: '../src/Payments/UI/Controller'
        tags: ['controller.service_arguments']

    App\Books\UI\:
        resource: '../src/Books/UI/'
        autowire: true
        autoconfigure: true
        
    App\Contacts\Infrastructure\Service\ContactMailerService:
        arguments:
            $receiverEmail: '%contact_receiver_email%'


    App\Books\Domain\Repository\BookRepositoryInterface: 
        alias: App\Books\Infrastructure\Repository\BookRepository
   

    App\Orders\Domain\Repository\OrderRepositoryInterface:
        alias: App\Orders\Infrastructure\Repository\OrderRepository

    App\Orders\Domain\Repository\OrderItemRepositoryInterface:
        alias: App\Orders\Infrastructure\Repository\OrderItemRepository

    App\Users\Domain\Repository\UserRepositoryInterface:
        alias: App\Users\Infrastructure\Repository\DoctrineUserRepository


    App\Payments\Application\UseCase\CreateStripeSession:
        autowire: true
        autoconfigure: true

    App\Orders\Application\Mapper\OrderMapper:
        autowire: true
        autoconfigure: true

    App\Orders\Application\Mapper\OrderItemMapper:
        autowire: true
        autoconfigure: true

    App\Payments\UI\Controller\StripeWebhookController:
        arguments:
            $stripeWebhookSecret: '%stripe_webhook_secret%'
  


   


           
 

   


    # default configuration for services in *this* file
    

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    
    # add more service definitions when explicit configuration is needed
